x-hr-core-service: &hr-core-service
  image: mcr.microsoft.com/playwright:v1.57.0-noble
  working_dir: /opt/hr-core
  command: sh -c "npm install && npm run start:dev"
  env_file:
    - ./.env
  environment:
    PORT: "3000"
    BULLMQ_REDIS_HOST: hr-bullmq-redis
    BULLMQ_REDIS_PORT: "6379"
    BULLMQ_REDIS_PASSWORD: ${BULLMQ_REDIS_PASSWORD}
    BULLMQ_REDIS_DB: ${BULLMQ_REDIS_DB}
    MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@hr-mongodb:27017/${MONGO_INITDB_DATABASE}?authSource=admin
  volumes:
    - ./hr-core:/opt/hr-core
  depends_on:
    hr-mongodb:
      condition: service_healthy
    hr-bullmq-redis:
      condition: service_healthy
  healthcheck:
    test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:3000/ || exit 1
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 30s
  networks:
    - hr-network

services:
  hr-core:
    image: nginx:1.27-alpine
    container_name: hr-core
    environment:
      HR_CORE_ACTIVE_SLOT: ${HR_CORE_ACTIVE_SLOT}
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
    ports:
      - "3000:3000"
    networks:
      - hr-network

  hr-core-blue:
    <<: *hr-core-service
    container_name: hr-core-blue
    volumes:
      - ./hr-core:/opt/hr-core
      - hr-core-blue-node-modules:/opt/hr-core/node_modules
    ports:
      - "3001:3000"

  hr-core-green:
    <<: *hr-core-service
    container_name: hr-core-green
    volumes:
      - ./hr-core:/opt/hr-core
      - hr-core-green-node-modules:/opt/hr-core/node_modules
    ports:
      - "3002:3000"

  hr-mongodb:
    image: mongo:8.2
    container_name: hr-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    command:
      - mongod
      - --bind_ip_all
      - --dbpath
      - /hr-data
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval "db.adminCommand('ping').ok" admin | grep 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "27777:27017"
    volumes:
      - ./hr-data:/hr-data
    networks:
      - hr-network

  hr-bullmq-redis:
    image: redis:8-alpine
    container_name: hr-bullmq-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${BULLMQ_REDIS_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$BULLMQ_REDIS_PASSWORD" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      BULLMQ_REDIS_PASSWORD: ${BULLMQ_REDIS_PASSWORD}
    ports:
      - "${BULLMQ_REDIS_HOST_PORT}:6379"
    volumes:
      - hr-bullmq-redis-data:/data
    networks:
      - hr-network

networks:
  hr-network:
    name: hr-network

volumes:
  hr-core-blue-node-modules:
  hr-core-green-node-modules:
  hr-bullmq-redis-data:
